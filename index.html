<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Maps 2GIS</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем 2GIS MapGL API -->
    <script src="https://mapgl.2gis.com/api/js/v1"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0f172a; }
        #map { width: 100vw; height: 100vh; }
        
        /* Панель управления поверх карты */
        .ui-panel { position: absolute; bottom: 20px; left: 20px; right: 20px; z-index: 999; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <!-- Контейнер для карты 2ГИС -->
    <div id="map"></div>

    <!-- Панель управления -->
    <div class="ui-panel">
        <div class="glass p-4 mb-3 hidden" id="room-info">
            <div class="flex justify-between items-center">
                <div>
                    <div class="text-xs text-slate-400">Твоя комната</div>
                    <div class="font-bold text-lg text-white" id="room-code-display">-</div>
                </div>
                <button onclick="copyInviteLink()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-bold active:scale-95 transition hover:bg-blue-700">
                    Пригласить 🔗
                </button>
            </div>
        </div>

        <div class="glass p-4 flex space-x-2">
            <button onclick="createRoom()" id="btn-create" class="flex-1 bg-blue-600 text-white font-bold py-3 rounded-xl active:scale-95 transition text-sm hover:bg-blue-700">
                Создать карту
            </button>
            <button onclick="getMyLocation(true)" class="flex-1 bg-green-600 text-white font-bold py-3 rounded-xl active:scale-95 transition text-sm hover:bg-green-700">
                Где я? 📍
            </button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp; 
        tg.expand(); 
        tg.ready();
        
        const userId = tg.initDataUnsafe?.user?.id || 0;
        const firstName = tg.initDataUnsafe?.user?.first_name || "Друг";

        // --- НАСТРОЙКИ 2ГИС ---
        const YOUR_2GIS_KEY = 'd2113ce9-d6f2-4930-91d5-b1a57cf1a99b'; 

        let map;
        let myMarker = null;
        let friendMarkers = {};
        let currentRoomId = null;
        let currentRoomCode = null;
        let locationInterval = null;
        let friendsInterval = null;

        // Инициализация карты 2ГИС (центр - Казань)
        // В 2ГИС порядок координат: [Долгота, Широта]
        // Казань: Широта 55.796127, Долгота 49.106405
        mapgl.load().then((mapgl) => {
            map = new mapgl.Map('map', {
                center: [49.106405, 55.796127], 
                zoom: 13,
                key: YOUR_2GIS_KEY,
            });

            // Проверяем URL на наличие кода приглашения
            const urlParams = new URLSearchParams(window.location.search);
            const inviteCode = urlParams.get('invite');
            if (inviteCode) {
                joinRoom(inviteCode);
            }
        });

        // --- ЛОГИКА КОМНАТ ---
        async function createRoom() {
            const btn = document.getElementById('btn-create');
            btn.innerText = "Создание...";
            try {
                const res = await fetch(`${window.location.origin}/api/create_room`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId })
                });
                const data = await res.json();
                if (data.room_id) {
                    currentRoomId = data.room_id;
                    currentRoomCode = data.invite_code;
                    showRoomInfo();
                    tg.showAlert("Карта создана! Отправь ссылку друзьям.");
                } else {
                    tg.showAlert("Ошибка: " + (data.error || "Неизвестно"));
                    btn.innerText = "Создать карту";
                }
            } catch(e) { 
                tg.showAlert("Ошибка сети"); 
                btn.innerText = "Создать карту";
            }
        }

        async function joinRoom(code) {
            try {
                const res = await fetch(`${window.location.origin}/api/join_room?code=${code}`);
                const data = await res.json();
                if (data.room_id) {
                    currentRoomId = data.room_id;
                    currentRoomCode = code;
                    showRoomInfo();
                    tg.showAlert("Ты присоединился к карте друга!");
                } else {
                    tg.showAlert("Комната не найдена или устарела.");
                }
            } catch(e) { 
                tg.showAlert("Ошибка входа"); 
            }
        }

        function showRoomInfo() {
            document.getElementById('room-info').classList.remove('hidden');
            document.getElementById('room-code-display').innerText = currentRoomCode;
            document.getElementById('btn-create').style.display = 'none';
            
            getMyLocation();
            
            if(locationInterval) clearInterval(locationInterval);
            if(friendsInterval) clearInterval(friendsInterval);

            locationInterval = setInterval(getMyLocation, 20000);
            friendsInterval = setInterval(loadFriends, 5000);
            loadFriends();
        }

        function copyInviteLink() {
            const link = `https://t.me/telegaMaps_bot?start=${currentRoomCode}`;
            navigator.clipboard.writeText(link).then(() => {
                tg.showAlert("Ссылка скопирована! Отправь её другу.");
            }).catch(() => {
                tg.showAlert("Не удалось скопировать. Ссылка: " + link);
            });
        }

        // --- ГЕОЛОКАЦИЯ ---
        async function getMyLocation(manual = false) {
            if (!tg.LocationManager || typeof tg.LocationManager.isSupported !== 'function') {
                if(manual) tg.showAlert("Геолокация недоступна. Обнови Telegram.");
                return;
            }
            if (!tg.LocationManager.isSupported()) {
                if(manual) tg.showAlert("Твоя версия Telegram не поддерживает геолокацию. Открой на телефоне.");
                return;
            }

            try {
                await tg.LocationManager.mount();
                if (!tg.LocationManager.isAccessGranted) {
                    await tg.LocationManager.requestLocation();
                }

                tg.LocationManager.getLocation((locationData) => {
                    if (locationData) {
                        const lat = locationData.latitude;
                        const lon = locationData.longitude;
                        
                        // В 2ГИС координаты: [lon, lat]
                        const coords = [lon, lat];

                        if (!myMarker) {
                            // Создаем маркер "Я" (синий)
                            myMarker = new mapgl.Marker(map, {
                                coordinates: coords,
                                icon: 'https://docs.2gis.com/img/mapgl/marker-blue.png', // Стандартная иконка
                                size: [30, 30],
                                anchor: [15, 30]
                            });
                            map.setCenter(coords);
                        } else {
                            myMarker.setCoordinates(coords);
                        }

                        if (currentRoomId) {
                            fetch(`${window.location.origin}/api/location`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ 
                                    room_id: currentRoomId, 
                                    user_id: userId, 
                                    first_name: firstName, 
                                    latitude: lat, 
                                    longitude: lon 
                                })
                            }).catch(err => console.log("Ошибка отправки координат", err));
                        }
                    } else if (manual) {
                        tg.showAlert("Не удалось получить геопозицию. Разреши доступ в настройках.");
                    }
                });
            } catch (error) {
                console.error("Ошибка LocationManager:", error);
                if (manual) tg.showAlert("Ошибка геолокации. Перезапусти приложение.");
            }
        }

        // --- ЗАГРУЗКА ДРУЗЕЙ ---
        async function loadFriends() {
            if (!currentRoomId) return;
            try {
                const res = await fetch(`${window.location.origin}/api/friends?room_id=${currentRoomId}`);
                const data = await res.json();
                
                data.forEach(friend => {
                    if (friend.user_id != userId && friend.latitude && friend.longitude) {
                        const coords = [parseFloat(friend.longitude), parseFloat(friend.latitude)];
                        
                        if (friendMarkers[friend.user_id]) {
                            friendMarkers[friend.user_id].setCoordinates(coords);
                        } else {
                            // Создаем маркер друга (зеленый)
                            friendMarkers[friend.user_id] = new mapgl.Marker(map, {
                                coordinates: coords,
                                icon: 'https://docs.2gis.com/img/mapgl/marker-green.png',
                                size: [25, 25],
                                anchor: [12.5, 25]
                            });
                        }
                    }
                });
            } catch (e) {
                console.log("Ошибка загрузки друзей", e);
            }
        }
    </script>
</body>
</html>
